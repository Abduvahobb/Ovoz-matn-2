name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android project files
        run: |
          mkdir -p app/src/main/java/com/example/voicetotext app/src/main/res/layout app/src/main/res/values

          cat > settings.gradle.kts <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VoiceToText"
          include(":app")
          EOF_SETTINGS

          cat > build.gradle.kts <<'EOF_ROOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_ROOT

          cat > gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_PROPS

          cat > app/build.gradle.kts <<'EOF_APP'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.voicetotext"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.voicetotext"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.VoiceToText">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF_MANIFEST

          cat > app/src/main/java/com/example/voicetotext/MainActivity.kt <<'EOF_KOTLIN'
          package com.example.voicetotext

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private val languages = listOf(
                  "O'zbekcha" to "uz-UZ",
                  "Русский" to "ru-RU",
                  "English" to "en-US"
              )

              private lateinit var spinner: Spinner
              private lateinit var resultText: TextView
              private lateinit var statusText: TextView
              private lateinit var micButton: Button
              private lateinit var copyButton: Button
              private lateinit var clearButton: Button

              private var recognizer: SpeechRecognizer? = null
              private var listening = false
              private var committedText = ""

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) {
                          startListening()
                      } else {
                          Toast.makeText(this, getString(R.string.permission_denied), Toast.LENGTH_LONG).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  spinner = findViewById(R.id.languageSpinner)
                  resultText = findViewById(R.id.resultText)
                  statusText = findViewById(R.id.statusText)
                  micButton = findViewById(R.id.micButton)
                  copyButton = findViewById(R.id.copyButton)
                  clearButton = findViewById(R.id.clearButton)

                  spinner.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      languages.map { it.first }
                  )

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      statusText.text = getString(R.string.not_available)
                      micButton.isEnabled = false
                  }

                  micButton.setOnClickListener {
                      if (listening) {
                          recognizer?.stopListening()
                      } else {
                          ensurePermissionAndListen()
                      }
                  }

                  copyButton.setOnClickListener {
                      val text = resultText.text.toString()
                      if (text.isNotBlank()) {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("voice_text", text))
                          Toast.makeText(this, getString(R.string.copied), Toast.LENGTH_SHORT).show()
                      }
                  }

                  clearButton.setOnClickListener {
                      committedText = ""
                      resultText.text = ""
                  }
              }

              private fun ensurePermissionAndListen() {
                  val granted = ContextCompat.checkSelfPermission(
                      this, Manifest.permission.RECORD_AUDIO
                  ) == PackageManager.PERMISSION_GRANTED

                  if (granted) startListening() else permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
              }

              private fun startListening() {
                  if (recognizer == null) {
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                          setRecognitionListener(listener)
                      }
                  }

                  val langTag = languages[spinner.selectedItemPosition].second
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                      )
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, langTag)
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  }

                  listening = true
                  micButton.text = getString(R.string.stop)
                  statusText.text = getString(R.string.preparing)
                  recognizer?.startListening(intent)
              }

              private fun finishListening() {
                  listening = false
                  micButton.text = getString(R.string.speak)
              }

              private fun showText(partial: String) {
                  resultText.text = listOf(committedText, partial)
                      .filter { it.isNotBlank() }
                      .joinToString(" ")
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {
                      statusText.text = getString(R.string.speak_now)
                  }

                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(rmsdB: Float) {}
                  override fun onBufferReceived(buffer: ByteArray?) {}

                  override fun onEndOfSpeech() {
                      statusText.text = getString(R.string.processing)
                  }

                  override fun onError(error: Int) {
                      finishListening()
                      statusText.text = when (error) {
                          SpeechRecognizer.ERROR_NO_MATCH,
                          SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> getString(R.string.err_no_speech)
                          SpeechRecognizer.ERROR_NETWORK,
                          SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> getString(R.string.err_network)
                          SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> getString(R.string.permission_denied)
                          else -> getString(R.string.err_generic, error)
                      }
                  }

                  override fun onResults(results: Bundle?) {
                      finishListening()
                      val text = results
                          ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          ?.firstOrNull()
                          .orEmpty()
                      if (text.isNotBlank()) {
                          committedText = listOf(committedText, text)
                              .filter { it.isNotBlank() }
                              .joinToString(" ")
                      }
                      showText("")
                      statusText.text = getString(R.string.done)
                  }

                  override fun onPartialResults(partialResults: Bundle?) {
                      val partial = partialResults
                          ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          ?.firstOrNull()
                          .orEmpty()
                      showText(partial)
                  }

                  override fun onEvent(eventType: Int, params: Bundle?) {}
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  recognizer = null
                  super.onDestroy()
              }
          }
          EOF_KOTLIN

          cat > app/src/main/res/layout/activity_main.xml <<'EOF_LAYOUT'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <Spinner
                  android:id="@+id/languageSpinner"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="12dp"
                  android:layout_marginBottom="12dp">

                  <TextView
                      android:id="@+id/resultText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="@string/hint"
                      android:textIsSelectable="true"
                      android:textSize="18sp" />
              </ScrollView>

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="8dp"
                  android:gravity="center" />

              <Button
                  android:id="@+id/micButton"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:text="@string/speak"
                  android:textSize="18sp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/copyButton"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginEnd="4dp"
                      android:layout_weight="1"
                      android:text="@string/copy" />

                  <Button
                      android:id="@+id/clearButton"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="4dp"
                      android:layout_weight="1"
                      android:text="@string/clear" />
              </LinearLayout>

          </LinearLayout>
          EOF_LAYOUT

          cat > app/src/main/res/values/strings.xml <<'EOF_STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Ovoz → Matn</string>
              <string name="hint">Gapirsangiz, matn shu yerda paydo bo\'ladi</string>
              <string name="speak">🎤 Gapirish</string>
              <string name="stop">⏹ To\'xtatish</string>
              <string name="copy">Nusxalash</string>
              <string name="clear">Tozalash</string>
              <string name="copied">Nusxalandi</string>
              <string name="preparing">Tayyorlanmoqda…</string>
              <string name="speak_now">Gapiring…</string>
              <string name="processing">Matnga aylantirilmoqda…</string>
              <string name="done">Tayyor</string>
              <string name="permission_denied">Mikrofon uchun ruxsat berilmadi</string>
              <string name="not_available">Bu qurilmada ovoz tanish xizmati yo\'q. Google ilovasini o\'rnating yoki yangilang.</string>
              <string name="err_no_speech">Ovoz eshitilmadi, qayta urinib ko\'ring</string>
              <string name="err_network">Internet bilan muammo</string>
              <string name="err_generic">Xatolik (kod: %1$d)</string>
          </resources>
          EOF_STRINGS

          cat > app/src/main/res/values/themes.xml <<'EOF_THEMES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VoiceToText" parent="Theme.Material3.DayNight.DarkActionBar" />
          </resources>
          EOF_THEMES

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
